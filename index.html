<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11 EduSim Pro 12.0 - NO JOKE</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI';margin:0}
body{background:#1e1e1e;color:#fff;height:100vh;overflow:hidden}
.desktop{height:calc(100vh - 48px);padding:20px;display:grid;grid-template-columns:repeat(auto-fill,90px);gap:20px}
.icon{text-align:center;padding:8px;border-radius:4px;cursor:pointer}.icon:hover{background:rgba(255,255,255,0.1)}
.window{position:absolute;width:800px;height:500px;background:#2d2d2d;border:1px solid #555;display:none;flex-direction:column;border-radius:6px;z-index:10}
.titlebar{height:30px;background:#333;display:flex;align-items:center;justify-content:space-between;padding:0 10px;cursor:move}
.content{flex:1;overflow:auto;padding:10px;background:#1e1e1e}
.taskbar{position:fixed;bottom:0;left:0;right:0;height:48px;background:#202020;display:flex;align-items:center;padding:0 10px}
.btn{padding:6px 12px;background:#0078D4;border:none;color:#fff;cursor:pointer;margin:2px}
input,textarea{background:#3c3c3c;color:#fff;border:1px solid #555;padding:5px;width:100%}
table{border-collapse:collapse}td,th{border:1px solid #555;padding:4px}
#paint{border:1px solid #555;cursor:crosshair;background:#fff}
</style>
</head>
<body>

<div class="desktop" id="desktop">
  <div class="icon" ondblclick="openWin('explorer')"><div>📁</div>File Explorer</div>
  <div class="icon" ondblclick="openWin('notepad')"><div>📝</div>Notepad</div>
  <div class="icon" ondblclick="openWin('paint')"><div>🎨</div>Paint</div>
  <div class="icon" ondblclick="openWin('calc')"><div>🔢</div>Calculator</div>
  <div class="icon" ondblclick="openWin('browser')"><div>🌐</div>Browser</div>
  <div class="icon" ondblclick="openWin('terminal')"><div>💻</div>Terminal</div>
  <div class="icon" ondblclick="openWin('excel')"><div>📊</div>Excel</div>
  <div class="icon" ondblclick="openWin('player')"><div>🎵</div>Media Player</div>
</div>

<!-- FILE EXPLORER - REAL TABS + FILES -->
<div class="window" id="explorer">
  <div class="titlebar"><span>File Explorer</span><button onclick="closeWin('explorer')">×</button></div>
  <div class="content">
    <div id="tabs"></div>
    <button onclick="newTab('C:')">C:</button><button onclick="newTab('D:')">D:</button><button onclick="newFolder()">New Folder</button>
    <div id="fileList"></div>
  </div>
</div>

<!-- NOTEPAD - REAL SAVE/LOAD -->
<div class="window" id="notepad">
  <div class="titlebar"><span>Notepad</span><button onclick="closeWin('notepad')">×</button></div>
  <div class="content">
    <button onclick="saveTxt()">Save.txt</button><button onclick="loadTxt()">Open.txt</button>
    <textarea id="noteText" style="height:400px"></textarea>
  </div>
</div>

<!-- PAINT - REAL DRAWING -->
<div class="window" id="paint">
  <div class="titlebar"><span>Paint</span><button onclick="closeWin('paint')">×</button></div>
  <div class="content">
    <canvas id="paint" width="750" height="400"></canvas><br>
    <button onclick="savePaint()">Save PNG</button><input type="color" id="paintColor">
  </div>
</div>

<!-- CALCULATOR - REAL MATH -->
<div class="window" id="calc">
  <div class="titlebar"><span>Calculator</span><button onclick="closeWin('calc')">×</button></div>
  <div class="content">
    <input id="calcDisplay"><br>
    <button onclick="calcPress('7')">7</button><button onclick="calcPress('8')">8</button><button onclick="calcPress('9')">9</button><button onclick="calcPress('/')">/</button><br>
    <button onclick="calcPress('4')">4</button><button onclick="calcPress('5')">5</button><button onclick="calcPress('6')">6</button><button onclick="calcPress('*')">*</button><br>
    <button onclick="calcPress('1')">1</button><button onclick="calcPress('2')">2</button><button onclick="calcPress('3')">3</button><button onclick="calcPress('-')">-</button><br>
    <button onclick="calcPress('0')">0</button><button onclick="calcResult()">=</button><button onclick="calcPress('+')">+</button>
  </div>
</div>

<!-- BROWSER - REAL TABS -->
<div class="window" id="browser">
  <div class="titlebar"><span>Browser</span><button onclick="closeWin('browser')">×</button></div>
  <div class="content">
    <input id="url" placeholder="https://google.com"><button onclick="go()">Go</button>
    <iframe id="web" style="width:100%;height:400px;border:none"></iframe>
  </div>
</div>

<!-- TERMINAL - REAL COMMANDS -->
<div class="window" id="terminal">
  <div class="titlebar"><span>Terminal</span><button onclick="closeWin('terminal')">×</button></div>
  <div class="content" style="background:#000;font-family:monospace">
    <div id="termOut"></div><input id="termIn" onkeydown="if(event.key=='Enter')runTerm()">
  </div>
</div>

<!-- EXCEL - REAL FORMULAS -->
<div class="window" id="excel">
  <div class="titlebar"><span>Excel</span><button onclick="closeWin('excel')">×</button></div>
  <div class="content"><div id="excelGrid"></div><button onclick="calcExcel()">Calculate</button></div>
</div>

<!-- MEDIA PLAYER -->
<div class="window" id="player">
  <div class="titlebar"><span>Media Player</span><button onclick="closeWin('player')">×</button></div>
  <div class="content"><input type="file" accept="audio/*,video/*" onchange="playMedia(event)"><video id="media" controls style="width:100%"></video></div>
</div>

<div class="taskbar"><button onclick="showDesktop()">Desktop</button><div id="taskList"></div></div>

<script>
let files={C:['Windows','Users'],D:['Data']}, currentTab='C:', openWins=[];
let termFS={C:{},D:{}};

// WINDOWS
function openWin(id){document.getElementById(id).style.display='flex';if(!openWins.includes(id)){openWins.push(id);document.getElementById('taskList').innerHTML+=`<button onclick="focusWin('${id}')">${id}</button>`}}
function closeWin(id){document.getElementById(id).style.display='none';openWins=openWins.filter(w=>w!=id)}
function focusWin(id){document.getElementById(id).style.zIndex=999}
function showDesktop(){openWins.forEach(id=>document.getElementById(id).style.display='none')}

// FILE EXPLORER REAL
function newTab(drive){currentTab=drive;loadFiles()}
function loadFiles(){document.getElementById('fileList').innerHTML=files[currentTab].map(f=>`<div ondblclick="openFile('${f}')">${f}</div>`).join('')}
function newFolder(){let name=prompt("Name:");if(name){files[currentTab].push(name);localStorage.setItem('fs',JSON.stringify(files));loadFiles()}}
function openFile(f){showToast("Opening "+f)}

// NOTEPAD REAL SAVE
function saveTxt(){let blob=new Blob([document.getElementById('noteText').value]);let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download="note.txt";a.click()}
function loadTxt(){let i=document.createElement('input');i.type='file';i.onchange=e=>{let r=new FileReader();r.onload=ev=>document.getElementById('noteText').value=ev.target.result;r.readAsText(e.target.files[0])};i.click()}

// PAINT REAL
let paint=document.getElementById('paint'),pctx=paint.getContext('2d'),drawing=false;
paint.onmousedown=()=>drawing=true;paint.onmouseup=()=>drawing=false;
paint.onmousemove=e=>{if(drawing){pctx.fillStyle=document.getElementById('paintColor').value;pctx.fillRect(e.offsetX,e.offsetY,4,4)}}
function savePaint(){let a=document.createElement('a');a.download='paint.png';a.href=paint.toDataURL();a.click()}

// CALCULATOR REAL
function calcPress(v){document.getElementById('calcDisplay').value+=v}
function calcResult(){document.getElementById('calcDisplay').value=eval(document.getElementById('calcDisplay').value)}

// BROWSER REAL
function go(){document.getElementById('web').src=document.getElementById('url').value}

// TERMINAL REAL
function runTerm(){let cmd=document.getElementById('termIn').value;let out=document.getElementById('termOut');
if(cmd=='dir')out.innerHTML+=`<br>${files[currentTab].join(' ')}`;
if(cmd.startsWith('mkdir')){files[currentTab].push(cmd.split(' ')[1]);loadFiles()}
out.innerHTML+=`<br>C:\\${currentTab}>`;document.getElementById('termIn').value=''}

// EXCEL REAL
let excelGrid=document.getElementById('excelGrid');
for(let r=0;r<10;r++){for(let c=0;c<5;c++)excelGrid.innerHTML+=`<input id="c${r}${c}" style="width:80px">`;excelGrid.innerHTML+='<br>'}
function calcExcel(){for(let r=0;r<10;r++)for(let c=0;c<5;c++){let v=document.getElementById(`c${r}${c}`).value;if(v.startsWith('='))document.getElementById(`c${r}${c}`).value=eval(v.slice(1))}}

// MEDIA
function playMedia(e){document.getElementById('media').src=URL.createObjectURL(e.target.files[0])}

function showToast(m){alert(m)}
loadFiles();
</script>
</body>
</html>
